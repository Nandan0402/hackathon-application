<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | NexusAI Platform</title>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/navigation.css">
</head>
<body style="justify-content: center; align-items: center; min-height: 100vh; position: relative;">

  <div class="bg-glow"></div>

  <!-- Top Simple Brand Header -->
  <header style="position: absolute; top: 1.5rem; left: 2rem;">
    <a href="index.html" class="brand-logo">
      <div class="brand-icon">N</div>
      <span>Nexus<span class="text-green">AI</span></span>
    </a>
  </header>

  <!-- Loading Overlay for Auth Simulation -->
  <div id="auth-loading-overlay" class="loading-overlay">
    <div class="spinner spinner-green spinner-lg"></div>
    <div style="font-size: 1.125rem; font-weight: 600; color: var(--text-main);" id="loading-overlay-text">Authenticating Credentials...</div>
    <div style="font-size: 0.875rem; color: var(--text-muted);">Communicating with authentication service</div>
  </div>

  <div class="container container-narrow" style="padding: 2rem 1rem;">
    <div class="card card-glass card-accent-top">
      <div style="text-align: center; margin-bottom: 1.75rem;">
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p id="role-notice-text">Sign in to access your NexusAI Portal</p>
      </div>

      <!-- General Alert Container for Global Auth Errors -->
      <div id="auth-error-alert" class="alert alert-danger" style="display: none;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>
        <span id="auth-error-message">Invalid email or password.</span>
      </div>

      <!-- Role Selector Toggle Buttons -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; background: var(--bg-dark); padding: 0.35rem; border-radius: var(--radius-md); border: 1px solid var(--border-color-light);">
        <button type="button" class="btn btn-primary role-select-btn flex-1" data-role="worker">Worker</button>
        <button type="button" class="btn btn-secondary role-select-btn flex-1" data-role="employer">Employer</button>
        <button type="button" class="btn btn-secondary role-select-btn flex-1" data-role="admin">Admin</button>
      </div>

      <form id="login-form" novalidate>
        <input type="hidden" id="selected-role-input" value="worker">

        <div class="form-group" id="email-group">
          <label class="form-label" for="email">Email Address</label>
          <div class="input-icon-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input type="email" id="email" class="form-control" placeholder="name@domain.com" required value="alex.rivera@example.com">
          </div>
          <span class="form-error" id="email-error">Please enter a valid email address.</span>
        </div>

        <div class="form-group" id="password-group">
          <div class="form-label">
            <span>Password</span>
            <a href="#" style="font-size: 0.75rem;" onclick="window.showToast('Password reset link sent if account exists', 'info'); return false;">Forgot password?</a>
          </div>
          <div class="input-icon-wrapper">
            <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" class="form-control" placeholder="••••••••" required value="demo12345">
          </div>
          <span class="form-error" id="password-error">Password is required.</span>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; font-size: 0.875rem; color: var(--text-muted); cursor: pointer;">
            <input type="checkbox" id="remember-me" checked style="accent-color: var(--accent-green);"> Remember session on this browser
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="login-submit-btn">
          Sign In & Launch Dashboard
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        Don't have an account? <a href="register.html" style="font-weight: 600;">Create Account</a>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
